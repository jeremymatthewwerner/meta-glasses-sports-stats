[project]
name = "sideline-cv"
version = "0.1.0"
description = "Offline computer vision for Sideline game recordings: players, tracks, jersey crops per called play."
requires-python = ">=3.11,<3.13"
dependencies = [
  "rfdetr>=1.2",          # Apache-2.0 detector (Roboflow)
  "trackers>=2.0",        # Apache-2.0 SORT / ByteTrack re-implementations (Roboflow)
  "supervision>=0.26",    # MIT: detections, annotation, video IO
  "opencv-python>=4.10",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sideline-cv = "sideline_cv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sideline_cv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
